<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Aplikasi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-10 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-5 sm:px-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold text-slate-900 flex items-center gap-2">🚀 Portal Aplikasi</h1>
        <p class="text-xs sm:text-sm text-slate-500 mt-1">Akses cepat seluruh layanan & aplikasi terintegrasi</p>
      </div>
      <div class="relative max-w-xs w-full">
        <input type="text" id="searchInput" onkeyup="filterApps()" placeholder="Cari aplikasi..." class="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
        <span class="absolute left-3 top-2.5 text-slate-400 text-sm">🔍</span>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 sm:px-6">
    <div id="loading" class="flex flex-col items-center justify-center py-20">
      <div class="animate-spin rounded-full h-10 w-10 border-4 border-blue-500 border-t-transparent"></div>
      <p class="text-slate-500 text-sm mt-4">Memuat data dari Spreadsheet...</p>
    </div>

    <div id="noResults" class="hidden text-center py-16 bg-white rounded-xl border border-slate-200">
      <p class="text-4xl mb-2">🔎</p>
      <h3 class="text-base font-semibold text-slate-700">Aplikasi tidak ditemukan</h3>
    </div>

    <div id="appGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5 hidden"></div>
  </main>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbz5a_9zYbE5Q23M8HzvQrJsxibU26eLKw2vWvvr9vPK6mB2XVUThzKMXDR5y8pbUSHN/exec";
    let allApps = [];

    async function fetchApps() {
      try {
        const response = await fetch(API_URL);
        allApps = await response.json();
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('appGrid').classList.remove('hidden');
        displayList(allApps);
      } catch (error) {
        document.getElementById('loading').innerHTML = `<p class="text-red-500 font-semibold">Gagal mengambil data dari Google Sheets.</p>`;
      }
    }

    function displayList(apps) {
      const appGrid = document.getElementById('appGrid');
      const noResults = document.getElementById('noResults');
      appGrid.innerHTML = '';

      if (apps.length === 0) {
        noResults.classList.remove('hidden');
        return;
      }
      noResults.classList.add('hidden');

      apps.forEach(app => {
        const card = document.createElement('a');
        card.href = app.url;
        card.target = '_blank';
        card.rel = 'noopener noreferrer';
        card.className = 'group block p-5 rounded-2xl shadow-sm border border-slate-200/80 hover:shadow-md hover:-translate-y-1 transition-all duration-200 flex flex-col justify-between';
        card.style.backgroundColor = app.bgColor || '#ffffff';

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-3">
              <span class="text-3xl p-2 bg-white/70 backdrop-blur-sm rounded-xl shadow-xs inline-block">${app.emoji || '📱'}</span>
              <span class="text-slate-400 group-hover:text-slate-700 transition-colors text-sm">↗</span>
            </div>
            <h2 class="text-base font-bold text-slate-900 group-hover:text-blue-600 transition-colors line-clamp-1">${app.nama}</h2>
            <p class="text-xs text-slate-600 mt-1.5 line-clamp-2 leading-relaxed">${app.subtitle || ''}</p>
          </div>
          <div class="mt-5 pt-3 border-t border-black/5 flex items-center justify-between text-xs font-semibold text-slate-700 group-hover:text-blue-600">
            <span>Buka Aplikasi</span>
            <span>&rarr;</span>
          </div>
        `;
        appGrid.appendChild(card);
      });
    }

    function filterApps() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allApps.filter(app => 
        app.nama.toLowerCase().includes(query) || 
        app.subtitle.toLowerCase().includes(query)
      );
      displayList(filtered);
    }

    window.onload = fetchApps;
  </script>
</body>
</html>
